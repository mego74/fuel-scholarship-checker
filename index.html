<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FUEL Scholarship Checker</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6fa;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --ink: #172033;
        --muted: #647084;
        --line: #d8e0eb;
        --line-strong: #b8c5d6;
        --blue: #1f5fbf;
        --blue-dark: #164a96;
        --blue-soft: #eaf2ff;
        --green: #24734f;
        --red: #aa2b1d;
        --yellow: #8a630d;
        --shadow: 0 18px 42px rgba(23, 32, 51, 0.10);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, #e8f0fa 0, rgba(232, 240, 250, 0) 360px),
          var(--bg);
      }

      main {
        min-height: 100vh;
        padding: 34px 24px 40px;
      }

      .shell {
        max-width: 1080px;
        margin: 0 auto;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 24px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--blue-dark);
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
        font-weight: 780;
        letter-spacing: 0;
      }

      .legend {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(23, 32, 51, 0.18);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 18px;
        align-items: start;
      }

      .panel,
      .rail {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .panel {
        overflow: hidden;
      }

      .section {
        padding: 22px;
      }

      .section + .section {
        border-top: 1px solid var(--line);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 760;
        letter-spacing: 0;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 9px;
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .upload-grid,
      .mapping-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .file-box {
        display: grid;
        gap: 10px;
        min-height: 150px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        padding: 16px;
        background: var(--surface-soft);
      }

      .file-box:focus-within {
        outline: 3px solid rgba(31, 95, 191, 0.18);
        border-color: var(--blue);
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 760;
      }

      .file-name {
        min-height: 22px;
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      input[type="file"] {
        width: 100%;
        max-width: 100%;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
      }

      input[type="file"]::file-selector-button {
        min-height: 38px;
        margin-right: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 0 12px;
        color: var(--ink);
        background: #ffffff;
        font: inherit;
        font-weight: 720;
        cursor: pointer;
      }

      .route {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: var(--surface-soft);
      }

      .amount {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border-radius: 6px;
        background: var(--blue-soft);
        color: var(--blue-dark);
        font-weight: 780;
      }

      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 42px 0 11px;
        color: var(--ink);
        font: inherit;
        appearance: none;
        background:
          linear-gradient(45deg, transparent 50%, var(--muted) 50%),
          linear-gradient(135deg, var(--muted) 50%, transparent 50%),
          #ffffff;
        background-position:
          calc(100% - 18px) 18px,
          calc(100% - 13px) 18px,
          100% 0;
        background-size:
          5px 5px,
          5px 5px,
          2.5em 100%;
        background-repeat: no-repeat;
      }

      select:disabled {
        color: var(--muted);
        background-color: #f2f5f9;
      }

      select:focus {
        outline: 3px solid rgba(31, 95, 191, 0.16);
        border-color: var(--blue);
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line-strong);
      }

      .status.running .status-dot {
        background: var(--blue);
      }

      .status.done .status-dot {
        background: var(--green);
      }

      .status.error {
        color: var(--red);
      }

      .status.error .status-dot {
        background: var(--red);
      }

      button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        padding: 0 18px;
        color: #ffffff;
        background: var(--blue);
        font: inherit;
        font-weight: 760;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(31, 95, 191, 0.22);
      }

      button:hover {
        background: var(--blue-dark);
      }

      button:disabled {
        opacity: 0.56;
        cursor: not-allowed;
        box-shadow: none;
      }

      .rail {
        position: sticky;
        top: 24px;
        overflow: hidden;
      }

      .rail-header {
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      .rail-title {
        margin: 0;
        font-size: 15px;
        font-weight: 760;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border-bottom: 1px solid var(--line);
      }

      .metric {
        padding: 16px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }

      .metric:nth-child(2n) {
        border-right: 0;
      }

      .metric:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .metric span {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 680;
      }

      .metric strong {
        color: var(--ink);
        font-size: 25px;
        line-height: 1;
        font-weight: 780;
      }

      .metric.good strong {
        color: var(--green);
      }

      .metric.warn strong {
        color: var(--yellow);
      }

      .metric.bad strong {
        color: var(--red);
      }

      .downloads {
        display: grid;
        gap: 8px;
        padding: 16px;
      }

      .downloads a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        color: var(--ink);
        background: var(--surface-soft);
        text-decoration: none;
        font-weight: 720;
      }

      .downloads a:hover {
        border-color: var(--blue);
        color: var(--blue-dark);
        background: #ffffff;
      }

      .downloads a::after {
        content: "Download";
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      @media (max-width: 880px) {
        .workspace,
        .topbar {
          grid-template-columns: 1fr;
        }

        .legend {
          justify-content: flex-start;
        }

        .rail {
          position: static;
        }
      }

      @media (max-width: 680px) {
        main {
          padding: 20px 14px;
        }

        h1 {
          font-size: 26px;
        }

        .upload-grid,
        .mapping-grid {
          grid-template-columns: 1fr;
        }

        .route {
          grid-template-columns: 1fr;
        }

        .actions {
          align-items: stretch;
          flex-direction: column-reverse;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <div class="topbar">
          <div>
            <p class="eyebrow">NYU Tandon</p>
            <h1>FUEL Scholarship Checker</h1>
          </div>
          <div class="legend" aria-label="Output highlight colors">
            <span class="chip"><span class="swatch" style="background:#fff2cc"></span>Master row matched</span>
            <span class="chip"><span class="swatch" style="background:#f4cccc"></span>Fellowship row missing</span>
          </div>
        </div>

        <div class="workspace">
          <form id="checker-form" class="panel">
            <section class="section">
              <div class="section-title">
                <h2>Workbooks</h2>
                <span class="badge">Private browser processing</span>
              </div>
              <div class="upload-grid">
                <div class="file-box">
                  <label for="fellowship">Fellowship workbook</label>
                  <input id="fellowship" name="fellowship" type="file" accept=".xlsx" required />
                  <div class="file-name" data-for="fellowship">No file selected</div>
                </div>
                <div class="file-box">
                  <label for="master">Master workbook</label>
                  <input id="master" name="master" type="file" accept=".xlsx" required />
                  <div class="file-name" data-for="master">No file selected</div>
                </div>
              </div>
            </section>

            <section class="section">
              <div class="section-title">
                <h2>Amount Routing</h2>
                <span class="badge">Loaded from master tabs</span>
              </div>
              <div class="mapping-grid">
                <label class="route">
                  <span class="amount">$15,000</span>
                  <select id="sheet-15000" name="sheet_15000" disabled required>
                    <option value="">Upload master workbook first</option>
                  </select>
                </label>
                <label class="route">
                  <span class="amount">$20,000</span>
                  <select id="sheet-20000" name="sheet_20000" disabled required>
                    <option value="">Upload master workbook first</option>
                  </select>
                </label>
              </div>
            </section>

            <section class="section actions">
              <div id="status" class="status">
                <span class="status-dot"></span>
                <span id="status-text">Ready</span>
              </div>
              <button id="run-button" type="submit" disabled>Run check</button>
            </section>
          </form>

          <aside class="rail" aria-label="Run results">
            <div class="rail-header">
              <p class="rail-title">Run Results</p>
            </div>
            <div class="metrics">
              <div class="metric"><span>Checked</span><strong id="checked">0</strong></div>
              <div class="metric good"><span>Found</span><strong id="found">0</strong></div>
              <div class="metric bad"><span>Missing</span><strong id="missing">0</strong></div>
              <div class="metric warn"><span>Unsupported</span><strong id="unsupported">0</strong></div>
            </div>
            <div id="downloads" class="downloads">
              <span class="status">Downloads appear after a run.</span>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="vendor/exceljs.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script>
      const fellowshipInput = document.querySelector("#fellowship");
      const masterInput = document.querySelector("#master");
      const sheet15000Select = document.querySelector("#sheet-15000");
      const sheet20000Select = document.querySelector("#sheet-20000");
      const button = document.querySelector("#run-button");
      const statusEl = document.querySelector("#status");
      const statusText = document.querySelector("#status-text");
      const downloadsEl = document.querySelector("#downloads");
      const form = document.querySelector("#checker-form");
      const routeByAmount = new Map([
        [15000, sheet15000Select],
        [20000, sheet20000Select],
      ]);

      const fills = {
        yellow: { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFF2CC" } },
        red: { type: "pattern", pattern: "solid", fgColor: { argb: "FFF4CCCC" } },
        blue: { type: "pattern", pattern: "solid", fgColor: { argb: "FFD9EAF7" } },
        green: { type: "pattern", pattern: "solid", fgColor: { argb: "FFD9EAD3" } },
      };

      const labels = {
        zip: "All files",
        master: "Master highlighted",
        fellowship: "Fellowship checked",
        summary: "Match summary",
      };

      document.querySelectorAll('input[type="file"]').forEach((input) => {
        input.addEventListener("change", async () => {
          const target = document.querySelector(`[data-for="${input.id}"]`);
          target.textContent = input.files[0]?.name || "No file selected";
          resetResults();
          if (!input.files[0]) {
            if (input.id === "master") resetMasterRouting();
            updateRunButton();
            return;
          }
          if (input.id === "master") {
            await populateMasterTabs(input.files[0]);
          }
          updateRunButton();
        });
      });

      sheet15000Select.addEventListener("change", updateRunButton);
      sheet20000Select.addEventListener("change", updateRunButton);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        setStatus("running", "Processing in this browser...");
        downloadsEl.innerHTML = '<span class="status">Working on the files...</span>';

        try {
          if (!window.ExcelJS || !window.JSZip) {
            throw new Error("Excel libraries did not load. Check the internet connection and reload.");
          }
          const result = await processFiles();
          updateMetrics(result.totals);
          showDownloads(result.outputs);
          setStatus("done", "Complete");
        } catch (error) {
          setStatus("error", error.message);
          downloadsEl.innerHTML = '<span class="status">No files created.</span>';
        } finally {
          updateRunButton();
        }
      });

      resetMasterRouting();
      updateRunButton();

      function setStatus(kind, text) {
        statusEl.classList.remove("running", "done", "error");
        if (kind) statusEl.classList.add(kind);
        statusText.textContent = text;
      }

      function resetResults() {
        updateMetrics({ checked: 0, found: 0, missing: 0, unsupportedAmount: 0 });
        downloadsEl.innerHTML = '<span class="status">Downloads appear after a run.</span>';
        setStatus(null, "Ready");
      }

      function updateMetrics(totals) {
        document.querySelector("#checked").textContent = Number(totals.checked || 0).toLocaleString();
        document.querySelector("#found").textContent = Number(totals.found || 0).toLocaleString();
        document.querySelector("#missing").textContent = Number(totals.missing || 0).toLocaleString();
        document.querySelector("#unsupported").textContent = Number(totals.unsupportedAmount || 0).toLocaleString();
      }

      function resetMasterRouting() {
        for (const select of routeByAmount.values()) {
          select.innerHTML = '<option value="">Upload master workbook first</option>';
          select.value = "";
          select.disabled = true;
        }
      }

      function updateRunButton() {
        button.disabled = !(
          fellowshipInput.files.length &&
          masterInput.files.length &&
          sheet15000Select.value &&
          sheet20000Select.value
        );
      }

      async function workbookFromFile(file) {
        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(await file.arrayBuffer());
        return workbook;
      }

      async function populateMasterTabs(file) {
        try {
          setStatus("running", "Reading Master tabs...");
          const workbook = await workbookFromFile(file);
          const sheets = workbook.worksheets.map((sheet) => sheet.name);
          setOptions(sheet15000Select, sheets);
          setOptions(sheet20000Select, sheets);
          sheet15000Select.value = chooseBestSheet(sheets, 15000);
          sheet20000Select.value = chooseBestSheet(sheets, 20000);
          setStatus(null, "Ready");
        } catch (error) {
          resetMasterRouting();
          setStatus("error", error.message);
        } finally {
          updateRunButton();
        }
      }

      function setOptions(select, options) {
        select.innerHTML = "";
        if (!options.length) {
          select.innerHTML = '<option value="">No tabs found</option>';
          select.disabled = true;
          return;
        }
        for (const optionValue of options) {
          const option = document.createElement("option");
          option.value = optionValue;
          option.textContent = optionValue;
          select.appendChild(option);
        }
        select.disabled = false;
      }

      function chooseBestSheet(sheets, amount) {
        const short = String(amount / 1000);
        return (
          sheets.find((sheet) => sheet.toLowerCase().includes(`${short}k`)) ||
          sheets.find((sheet) => sheet.includes(String(amount))) ||
          sheets[0] ||
          ""
        );
      }

      async function processFiles() {
        const fellowshipFile = fellowshipInput.files[0];
        const masterFile = masterInput.files[0];
        const amountToSheet = new Map([
          [15000, sheet15000Select.value],
          [20000, sheet20000Select.value],
        ]);

        const [fellowshipWorkbook, masterWorkbook] = await Promise.all([
          workbookFromFile(fellowshipFile),
          workbookFromFile(masterFile),
        ]);
        const fellowshipSheet = chooseFellowshipSheet(fellowshipWorkbook);
        const fellowshipHeaders = findHeaderRowAndColumns(fellowshipSheet, ["EMPL ID", "Total Offered Amount"]);
        const nameCol = findOptionalColumn(fellowshipSheet, ["NAME", "Name", "Student Name"]);
        const masterIndexes = buildMasterIndexes(masterWorkbook, amountToSheet);
        const records = [];
        const masterRowsToHighlight = new Map([...amountToSheet.keys()].map((amount) => [amount, new Set()]));
        const fellowshipHighlightWidth = lastMeaningfulColumn(fellowshipSheet, fellowshipHeaders.headerRow);

        clearAllDataFills(fellowshipSheet, fellowshipHeaders.headerRow);
        for (const index of masterIndexes.values()) {
          clearAllDataFills(index.sheet, index.headerRow);
        }

        for (let rowNumber = fellowshipHeaders.headerRow + 1; rowNumber <= fellowshipSheet.rowCount; rowNumber += 1) {
          const row = fellowshipSheet.getRow(rowNumber);
          const emplId = normalizeKey(row.getCell(fellowshipHeaders.columns["EMPL ID"]));
          const amount = normalizeAmount(row.getCell(fellowshipHeaders.columns["Total Offered Amount"]), fellowshipSheet);
          const studentName = nameCol ? String(displayValue(row.getCell(nameCol)) || "").trim() : "";
          if (!emplId && amount == null && !studentName) continue;

          const expectedSheet = amountToSheet.get(amount) || null;
          let status = "Unsupported Amount";
          let masterRows = [];
          if (expectedSheet) {
            masterRows = masterIndexes.get(amount)?.rowsByKey.get(emplId) || [];
            status = masterRows.length ? "Found" : "Missing";
          }

          if (status !== "Found") {
            fillRow(fellowshipSheet, rowNumber, fills.red, fellowshipHighlightWidth);
          } else {
            const rowSet = masterRowsToHighlight.get(amount);
            masterRows.forEach((masterRow) => rowSet.add(masterRow));
          }

          records.push({
            status,
            emplId,
            studentName,
            totalOfferedAmount: amount,
            expectedMasterSheet: expectedSheet,
            fellowshipSheet: fellowshipSheet.name,
            fellowshipRow: rowNumber,
            masterRows,
          });
        }

        for (const [amount, rowNumbers] of masterRowsToHighlight.entries()) {
          const index = masterIndexes.get(amount);
          if (!index) continue;
          rowNumbers.forEach((rowNumber) => fillRow(index.sheet, rowNumber, fills.yellow, index.highlightWidth));
        }

        const summaryWorkbook = createSummaryWorkbook(records, amountToSheet);
        const outputs = await createDownloads({
          fellowshipWorkbook,
          masterWorkbook,
          summaryWorkbook,
          fellowshipFile,
          masterFile,
        });
        return {
          totals: {
            checked: records.length,
            found: records.filter((record) => record.status === "Found").length,
            missing: records.filter((record) => record.status === "Missing").length,
            unsupportedAmount: records.filter((record) => record.status === "Unsupported Amount").length,
          },
          outputs,
        };
      }

      function displayValue(cell) {
        const value = cell?.value;
        if (value == null) return null;
        if (typeof value !== "object") return value;
        if (value instanceof Date) return value;
        if ("result" in value && value.result != null) return value.result;
        if ("text" in value && value.text != null) return value.text;
        if ("hyperlink" in value && value.text != null) return value.text;
        if ("richText" in value && Array.isArray(value.richText)) {
          return value.richText.map((part) => part.text || "").join("");
        }
        if ("formula" in value && value.formula) {
          const fallback = parseIfErrorFallback(value.formula);
          if (fallback != null) return fallback;
        }
        return String(value);
      }

      function parseIfErrorFallback(formula) {
        const match = String(formula).match(/IFERROR\\([\\s\\S]*,\\s*\"?([^,\")]+)\"?\\s*\\)$/i);
        if (!match) return null;
        const raw = match[1].replace(/\"\"/g, '"').trim();
        const number = Number(raw);
        return Number.isFinite(number) ? number : raw;
      }

      function normalizeHeader(value) {
        return String(value || "").replace(/\\s+/g, " ").trim().toLowerCase();
      }

      function normalizeKey(cell) {
        const value = displayValue(cell);
        if (value == null) return "";
        if (typeof value === "number" && Number.isInteger(value)) return String(value);
        return String(value).trim();
      }

      function normalizeAmount(cell, sheet) {
        const value = displayValue(cell);
        const direct = parseAmount(value);
        if (direct != null) return direct;
        const formula = cell?.value?.formula;
        if (formula) return evaluateSimpleSumFormula(formula, sheet);
        return null;
      }

      function parseAmount(value) {
        if (value == null || value === "") return null;
        if (typeof value === "number") return Math.round(value);
        const cleaned = String(value).replace(/[$,]/g, "").trim();
        if (!cleaned) return null;
        const parsed = Number(cleaned);
        return Number.isFinite(parsed) ? Math.round(parsed) : null;
      }

      function evaluateSimpleSumFormula(formula, sheet) {
        const refs = String(formula).match(/[A-Z]+\\d+/g) || [];
        if (!refs.length) return null;
        const total = refs.reduce((sum, ref) => {
          const amount = parseAmount(displayValue(sheet.getCell(ref)));
          return amount == null ? sum : sum + amount;
        }, 0);
        return total || null;
      }

      function findHeaderRowAndColumns(sheet, requiredHeaders) {
        const wanted = new Map(requiredHeaders.map((header) => [normalizeHeader(header), header]));
        let best = { row: 1, columns: {} };
        const maxRows = Math.min(sheet.rowCount, 25);
        for (let rowNumber = 1; rowNumber <= maxRows; rowNumber += 1) {
          const columns = {};
          const row = sheet.getRow(rowNumber);
          for (let colNumber = 1; colNumber <= sheet.columnCount; colNumber += 1) {
            const normalized = normalizeHeader(displayValue(row.getCell(colNumber)));
            if (wanted.has(normalized)) columns[wanted.get(normalized)] = colNumber;
          }
          if (requiredHeaders.every((header) => columns[header])) {
            return { headerRow: rowNumber, columns };
          }
          if (Object.keys(columns).length > Object.keys(best.columns).length) {
            best = { row: rowNumber, columns };
          }
        }
        const missing = requiredHeaders.filter((header) => !best.columns[header]).join(", ");
        throw new Error(`Missing required column(s): ${missing} in sheet "${sheet.name}".`);
      }

      function findOptionalColumn(sheet, headers) {
        for (const header of headers) {
          try {
            return findHeaderRowAndColumns(sheet, [header]).columns[header];
          } catch (_) {
            // Try the next possible name.
          }
        }
        return null;
      }

      function chooseFellowshipSheet(workbook) {
        for (const sheet of workbook.worksheets) {
          try {
            findHeaderRowAndColumns(sheet, ["EMPL ID", "Total Offered Amount"]);
            return sheet;
          } catch (_) {
            // Continue looking.
          }
        }
        throw new Error('Could not find a Fellowship sheet with "EMPL ID" and "Total Offered Amount".');
      }

      function findSheetByName(workbook, name) {
        const normalized = normalizeHeader(name).replace("$", "");
        const sheet = workbook.worksheets.find((candidate) => normalizeHeader(candidate.name).replace("$", "") === normalized);
        if (!sheet) throw new Error(`Could not find master sheet "${name}".`);
        return sheet;
      }

      function buildMasterIndexes(workbook, amountToSheet) {
        const indexes = new Map();
        for (const [amount, sheetName] of amountToSheet.entries()) {
          const sheet = findSheetByName(workbook, sheetName);
          const headerInfo = findHeaderRowAndColumns(sheet, ["EMPL ID"]);
          const rowsByKey = new Map();
          for (let rowNumber = headerInfo.headerRow + 1; rowNumber <= sheet.rowCount; rowNumber += 1) {
            const key = normalizeKey(sheet.getRow(rowNumber).getCell(headerInfo.columns["EMPL ID"]));
            if (!key) continue;
            if (!rowsByKey.has(key)) rowsByKey.set(key, []);
            rowsByKey.get(key).push(rowNumber);
          }
          indexes.set(amount, {
            sheet,
            rowsByKey,
            headerRow: headerInfo.headerRow,
            highlightWidth: lastMeaningfulColumn(sheet, headerInfo.headerRow),
          });
        }
        return indexes;
      }

      function fillRow(sheet, rowNumber, fill, width = Math.max(sheet.columnCount, 1)) {
        const row = sheet.getRow(rowNumber);
        for (let colNumber = 1; colNumber <= width; colNumber += 1) {
          row.getCell(colNumber).fill = cloneFill(fill);
        }
      }

      function cloneFill(fill) {
        return JSON.parse(JSON.stringify(fill));
      }

      function lastMeaningfulColumn(sheet, headerRow) {
        const row = sheet.getRow(headerRow);
        let lastColumn = 1;
        for (let colNumber = 1; colNumber <= sheet.columnCount; colNumber += 1) {
          if (String(displayValue(row.getCell(colNumber)) || "").trim()) {
            lastColumn = colNumber;
          }
        }
        return lastColumn;
      }

      function clearAllDataFills(sheet, headerRow) {
        const width = Math.max(sheet.columnCount, lastMeaningfulColumn(sheet, headerRow));
        for (let rowNumber = headerRow + 1; rowNumber <= sheet.rowCount; rowNumber += 1) {
          const row = sheet.getRow(rowNumber);
          clearFill(row);
          for (let colNumber = 1; colNumber <= width; colNumber += 1) {
            clearFill(row.getCell(colNumber));
          }
        }
      }

      function clearManagedHighlights(sheet, headerRow) {
        for (let rowNumber = headerRow + 1; rowNumber <= sheet.rowCount; rowNumber += 1) {
          const row = sheet.getRow(rowNumber);
          if (isManagedHighlight(row.style?.fill)) {
            clearFill(row);
          }
          for (let colNumber = 1; colNumber <= Math.max(sheet.columnCount, 1); colNumber += 1) {
            const cell = row.getCell(colNumber);
            if (isManagedHighlight(cell.fill)) {
              clearFill(cell);
            }
          }
        }
      }

      function clearFill(target) {
        if (!target) return;
        if (target.style) {
          target.style = { ...target.style };
          delete target.style.fill;
        }
        target.fill = undefined;
      }

      function isManagedHighlight(fill) {
        const color = fill?.fgColor?.argb;
        return color === fills.red.fgColor.argb || color === fills.yellow.fgColor.argb;
      }

      function createSummaryWorkbook(records, amountToSheet) {
        const workbook = new ExcelJS.Workbook();
        workbook.creator = "FUEL Scholarship Checker";
        const summary = workbook.addWorksheet("Summary");
        summary.addRows([
          ["FUEL Scholarship Match Summary"],
          ["Fellowship rows are routed to the master tab by Total Offered Amount and matched by EMPL ID."],
          [],
          ["Metric", "Count"],
          ["Fellowship rows checked", records.length],
          ["Found in master", records.filter((record) => record.status === "Found").length],
          ["Missing from master", records.filter((record) => record.status === "Missing").length],
          ["Unsupported amount", records.filter((record) => record.status === "Unsupported Amount").length],
          [],
          ["Amount", "Master Tab"],
          ...[...amountToSheet.entries()].map(([amount, sheet]) => [amount, sheet]),
        ]);
        summary.getRow(1).font = { bold: true, size: 15 };
        [4, 10].forEach((rowNumber) => {
          summary.getRow(rowNumber).eachCell((cell) => {
            cell.fill = fills.blue;
            cell.font = { bold: true };
          });
        });
        summary.columns = [{ width: 34 }, { width: 22 }];

        const detail = workbook.addWorksheet("Details");
        detail.addRow([
          "Status",
          "EMPL ID",
          "Name",
          "Total Offered Amount",
          "Expected Master Tab",
          "Fellowship Sheet",
          "Fellowship Row",
          "Master Row(s)",
        ]);
        detail.getRow(1).eachCell((cell) => {
          cell.fill = fills.blue;
          cell.font = { bold: true };
        });
        records.forEach((record) => {
          const row = detail.addRow([
            record.status,
            record.emplId,
            record.studentName,
            record.totalOfferedAmount,
            record.expectedMasterSheet,
            record.fellowshipSheet,
            record.fellowshipRow,
            record.masterRows.join(", "),
          ]);
          if (record.status === "Missing" || record.status === "Unsupported Amount") {
            row.eachCell((cell) => {
              cell.fill = fills.red;
            });
          } else if (record.status === "Found") {
            row.getCell(1).fill = fills.green;
          }
        });
        detail.columns = Array.from({ length: 8 }, () => ({ width: 24 }));
        detail.views = [{ state: "frozen", ySplit: 1 }];
        return workbook;
      }

      async function createDownloads({ fellowshipWorkbook, masterWorkbook, summaryWorkbook, fellowshipFile, masterFile }) {
        const fellowshipBuffer = await fellowshipWorkbook.xlsx.writeBuffer();
        const masterBuffer = await masterWorkbook.xlsx.writeBuffer();
        const summaryBuffer = await summaryWorkbook.xlsx.writeBuffer();
        const fellowshipName = `${stem(fellowshipFile.name)}_checked.xlsx`;
        const masterName = `${stem(masterFile.name)}_highlighted.xlsx`;
        const summaryName = "fuel_scholarship_match_summary.xlsx";
        const zip = new JSZip();
        zip.file(fellowshipName, fellowshipBuffer);
        zip.file(masterName, masterBuffer);
        zip.file(summaryName, summaryBuffer);
        const zipBuffer = await zip.generateAsync({ type: "arraybuffer" });
        return {
          zip: makeDownload("fuel_scholarship_checked_outputs.zip", zipBuffer),
          master: makeDownload(masterName, masterBuffer),
          fellowship: makeDownload(fellowshipName, fellowshipBuffer),
          summary: makeDownload(summaryName, summaryBuffer),
        };
      }

      function stem(filename) {
        return filename.replace(/\\.xlsx$/i, "");
      }

      function makeDownload(filename, buffer) {
        const blob = new Blob([buffer], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
        return { filename, url: URL.createObjectURL(blob) };
      }

      function showDownloads(outputs) {
        downloadsEl.innerHTML = "";
        for (const key of ["zip", "master", "fellowship", "summary"]) {
          const output = outputs[key];
          if (!output) continue;
          const link = document.createElement("a");
          link.href = output.url;
          link.download = output.filename;
          link.textContent = labels[key] || output.filename;
          downloadsEl.appendChild(link);
        }
      }
    </script>
  </body>
</html>
